<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo | Caccin Cablaggi</title>
    <style>
        :root { --primary: #006666; --accent: #ff6b35; --bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #1e293b; line-height: 1.6; }
        .container { width: 92%; max-width: 1200px; margin: auto; }

        /* Banner Vantaggi */
        .vantaggi-bar { background: var(--primary); color: white; padding: 15px; display: flex; justify-content: space-around; font-size: 14px; margin-bottom: 30px; border-radius: 0 0 12px 12px; flex-wrap: wrap; gap: 10px; }

        /* Filtri */
        .tools { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { padding: 10px 20px; border: 2px solid var(--primary); border-radius: 20px; cursor: pointer; background: transparent; color: var(--primary); font-weight: bold; }
        .filter-btn.active { background: var(--primary); color: white; }
        #search { padding: 10px; flex: 1; border: 1px solid #cbd5e1; border-radius: 8px; min-width: 200px; }

        /* Grid */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .prod-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; }
        .prod-img { width: 100%; height: 160px; object-fit: contain; cursor: pointer; border-radius: 8px; margin-bottom: 10px; }
        .price { font-size: 18px; font-weight: bold; color: var(--accent); margin: 10px 0; display: block; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }

        /* Carrello */
        .cart-sticky { position: sticky; top: 20px; background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
        .qta-ctrl { display: flex; gap: 5px; }
        
        /* Modale */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; max-width: 400px; }
    </style>
</head>
<body>

<div class="vantaggi-bar">
    <span>✓ Testati singolarmente</span><span>✓ Assemblati in Italia</span><span>✓ IVA inclusa</span><span>✓ Personalizzabili</span>
</div>

<div class="container">
    <div class="tools">
        <button class="filter-btn active" onclick="filtra('tutti', this)">Tutti</button>
        <button class="filter-btn" onclick="filtra('lan', this)">Cavi LAN</button>
        <button class="filter-btn" onclick="filtra('prolunghe', this)">Prolunghe</button>
        <button class="filter-btn" onclick="filtra('alimentazione', this)">Alimentazione</button>
        <input type="text" id="search" placeholder="🔎 Cerca prodotto..." oninput="cerca()">
    </div>

    <div style="display: flex; gap: 30px; flex-wrap: wrap;">
        <div id="grid" class="products-grid" style="flex: 2;">
            <!-- Prodotti LAN -->
            <div class="prod-card" data-cat="lan" data-nome="Cavo LAN Cat6">
                <img src="img/cavo-cat6.jpeg" class="prod-img" onclick="mostraDettagli('Cavo LAN Cat6', '5m', 'RJ45', 'Rete/PC')">
                <h3>Cavo LAN Cat6 (5m)</h3>
                <span class="price">12,50 €</span>
                <button class="btn" onclick="aggiungi('Cavo LAN Cat6 5m', 12.50)">Aggiungi</button>
            </div>
            <!-- Prodotti Prolunghe -->
            <div class="prod-card" data-cat="prolunghe" data-nome="Prolunga 16A">
                <img src="img/prolunga.jpeg" class="prod-img" onclick="mostraDettagli('Prolunga 16A', '2m', 'Vimar 16A', 'Civile/Industriale')">
                <h3>Prolunga 16A (2m)</h3>
                <span class="price">17,50 €</span>
                <button class="btn" onclick="aggiungi('Prolunga 16A 2m', 17.50)">Aggiungi</button>
            </div>
            <!-- Prodotti Alimentazione -->
            <div class="prod-card" data-cat="alimentazione" data-nome="Cavo IEC">
                <img src="img/cavo-iec.jpeg" class="prod-img" onclick="mostraDettagli('Cavo IEC', '2m', 'C13/Schuko', 'PC/Monitor')">
                <h3>Cavo IEC (2m)</h3>
                <span class="price">12,00 €</span>
                <button class="btn" onclick="aggiungi('Cavo IEC 2m', 12.00)">Aggiungi</button>
            </div>
        </div>

        <div class="cart-sticky" style="flex: 1; min-width: 300px;">
            <h3>🛒 Carrello (<span id="cart-count">0</span>)</h3>
            <div id="cart-list" style="margin: 15px 0;"></div>
            <hr>
            <label><b>Zona Spedizione:</b></label>
            <select id="sped" onchange="render()" style="width:100%; padding: 8px; margin: 10px 0;">
                <option value="10">VE/PD/TV - 10,00 €</option>
                <option value="5.99">Italia - 5,99 €</option>
                <option value="0">Ritiro in sede - 0,00 €</option>
            </select>
            <h4>Totale: <span id="totale">0,00</span> €</h4>
            <button class="btn" style="background:var(--accent); margin-top:10px;" onclick="invia()">Invia Ordine</button>
            <button class="btn" style="background:#64748b; margin-top:5px;" onclick="svuota()">Svuota</button>
        </div>
    </div>
</div>

<div id="modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="m-nome"></h2>
        <ul id="m-spec" style="margin: 15px 0; padding-left: 20px;"></ul>
        <button class="btn" onclick="document.getElementById('modal').style.display='none'">Chiudi</button>
    </div>
</div>

<script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function aggiungi(nome, prezzo) {
        let item = cart.find(i => i.nome === nome);
        item ? item.qta++ : cart.push({nome, prezzo, qta: 1});
        save(); alert("✓ Prodotto aggiunto");
    }

    function save() { localStorage.setItem('cart', JSON.stringify(cart)); render(); }
    function svuota() { cart = []; save(); }

    function render() {
        let list = document.getElementById('cart-list');
        list.innerHTML = '';
        let subtot = 0;
        cart.forEach((i, idx) => {
            subtot += i.prezzo * i.qta;
            list.innerHTML += `<div class="cart-item">
                ${i.nome} (x${i.qta})
                <div class="qta-ctrl"><button onclick="mod(${idx}, -1)">-</button><button onclick="mod(${idx}, 1)">+</button></div>
            </div>`;
        });
        document.getElementById('cart-count').innerText = cart.reduce((a,b) => a+b.qta, 0);
        let sped = parseFloat(document.getElementById('sped').value);
        document.getElementById('totale').innerText = (subtot + sped).toFixed(2);
    }

    function mod(idx, d) {
        cart[idx].qta += d;
        if(cart[idx].qta <= 0) cart.splice(idx, 1);
        save();
    }

    function mostraDettagli(n, l, c, u) {
        document.getElementById('m-nome').innerText = n;
        document.getElementById('m-spec').innerHTML = `<li>Lunghezza: ${l}</li><li>Connettori: ${c}</li><li>Utilizzo: ${u}</li><li>Testato: Sì</li>`;
        document.getElementById('modal').style.display = 'flex';
    }

    function filtra(c, el) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        document.querySelectorAll('.prod-card').forEach(p => p.style.display = (c==='tutti' || p.dataset.cat===c) ? 'flex' : 'none');
    }

    function cerca() {
        let v = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.prod-card').forEach(p => p.style.display = p.dataset.nome.toLowerCase().includes(v) ? 'flex' : 'none');
    }

    render();
</script>
</body>
</html>
