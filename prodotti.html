<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Prodotti - Caccin Cablaggi</title>
    <!-- Includi qui lo stesso CSS che hai già nell'index.html -->
    <style>
        .prod-card { border: 1px solid #ddd; padding: 20px; margin: 10px; border-radius: 10px; text-align: center; }
        .carrello-box { position: sticky; top: 100px; background: #f8fafc; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>

<!-- Header con menu (deve essere identico all'index) -->
<header>...</header>

<div class="container" style="padding-top: 50px;">
    <h1>I Nostri Prodotti Pronti</h1>
    
    <div style="display: flex; gap: 40px;">
        <!-- Lista Prodotti -->
        <div id="lista-prodotti" style="flex: 2;">
            <div class="prod-card">
                <h3>Cavo LAN Cat6 RJ45 (2mt)</h3>
                <p>Testato e crimpato professionalmente.</p>
                <p><b>Prezzo: 12,00€ (IVA inclusa)</b></p>
                <input type="number" id="q-lan2" value="1" min="1" style="width: 50px;">
                <button onclick="aggiungiAlCarrello('Cavo LAN 2mt', 12.00, 'q-lan2')">Aggiungi al Carrello</button>
            </div>
            <!-- Aggiungi altre card prodotti qui -->
        </div>

        <!-- Carrello e Dati Spedizione -->
        <div class="carrello-box" style="flex: 1;">
            <h2>Carrello</h2>
            <ul id="lista-carrello"></ul>
            <p>Totale: <span id="totale">0,00</span>€</p>
            
            <hr>
            <h3>Dati Spedizione</h3>
            <input type="text" id="nome" placeholder="Nome e Cognome"><br>
            <input type="text" id="indirizzo" placeholder="Indirizzo"><br>
            <input type="text" id="cap" placeholder="CAP"><br>
            
            <button onclick="inviaOrdine('whatsapp')">Invia su WhatsApp</button>
            <button onclick="inviaOrdine('mail')">Invia via Mail</button>
        </div>
    </div>
</div>

<script>
    let carrello = [];
    let numeroOrdine = Math.floor(Math.random() * 10000); // Genera un numero ordine casuale

    function aggiungiAlCarrello(nome, prezzo, idInput) {
        let qta = document.getElementById(idInput).value;
        carrello.push({nome, prezzo, qta});
        aggiornaCarrello();
    }

    function aggiornaCarrello() {
        let lista = document.getElementById('lista-carrello');
        let totale = 0;
        lista.innerHTML = '';
        carrello.forEach(item => {
            lista.innerHTML += `<li>${item.nome} x${item.qta} - ${(item.prezzo * item.qta).toFixed(2)}€</li>`;
            totale += (item.prezzo * item.qta);
        });
        document.getElementById('totale').innerText = totale.toFixed(2);
    }

    function inviaOrdine(metodo) {
        let msg = `Ordine #${numeroOrdine}%0A`;
        carrello.forEach(i => msg += `${i.nome} (x${i.qta})%0A`);
        msg += `---%0ACliente: ${document.getElementById('nome').value}%0AIndirizzo: ${document.getElementById('indirizzo').value}`;
        
        if(metodo === 'whatsapp') {
            window.open(`https://wa.me/393392859037?text=${msg}`);
        } else {
            window.location.href = `mailto:caccin.cablaggi@gmail.com?subject=Ordine #${numeroOrdine}&body=${msg}`;
        }
    }
</script>
</body>
</html>
